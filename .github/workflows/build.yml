# ci-trigger: force rerun after path-fix
name: Build MT6771 UEFI

on:
  push:
    branches: [ main ]
    paths:
      - 'Platform/OPPO/A3Pkg/**'
      - 'BootShim/**'
      - 'Silicon/**'
      - 'Common/**'
      - 'Tools/**'
      - 'Patches/**'
      - 'build.sh'
      - '.github/workflows/**'
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  TARGET: RELEASE
  PLATFORM: OPPO/A3Pkg
  CLANG38_AARCH64_PREFIX: aarch64-linux-gnu-

jobs:
  build:
    runs-on: ubuntu-24.04
    timeout-minutes: 120
    steps:
      - name: Checkout source
        uses: actions/checkout@v4
        with:
          submodules: true

      - name: Show environment
        run: |
          echo "Platform: $PLATFORM"
          echo "Target: $TARGET"
          echo "Runner: $(uname -a)"
          echo "Commit: $(git rev-parse HEAD)"

      - name: Install build dependencies
        run: |
          # GRUB arm64 (Architecture: any) + mtools/dosfstools for the ESP image
          sudo apt-get install -y --no-install-recommends grub-common grub-efi-arm64-bin mtools dosfstools
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            build-essential gcc gcc-aarch64-linux-gnu libc6-dev-arm64-cross \
            python3 python3-pip make git curl ca-certificates \
            device-tree-compiler uuid-dev libssl-dev nasm mono-complete llvm clang iasl

      - name: Verify pinned EDK2 submodules
        run: |
          set -euo pipefail
          test -f Common/edk2/BaseTools/Makefile
          test -d Common/edk2-platforms/Platform
          echo "edk2        : $(git -C Common/edk2 rev-parse HEAD)"
          echo "edk2-plat   : $(git -C Common/edk2-platforms rev-parse HEAD)"

      - name: Install Python build tools
        run: |
          set -euo pipefail
          python3 -m pip install --break-system-packages \
            edk2-pytool-extensions edk2-pytool-library pyyaml

      - name: Initialize EDK2 environment
        run: |
          set -euo pipefail
          # build.sh -s runs stuart_setup + stuart_update, which installs the
          # tools listed in *.ext_dep and configures Conf/.
          ./build.sh -s -t "$TARGET" "$PLATFORM"
          echo "--- Conf/target.txt ---"
          sed -n '1,80p' Conf/target.txt || true

      - name: Build OTG image
        id: build_otg
        run: |
          set -o pipefail
          export USB_MODE=OTG
          ./build.sh -t "$TARGET" "$PLATFORM" 2>&1 | tee build-otg.log
        continue-on-error: true

      - name: Stash OTG artifacts
        if: always()
        run: |
          mkdir -p out
          cp -v Build/boot-uefi-otg.img out/ 2>/dev/null || true
          cp -v "$(find Build -name '*_UEFI.fd' | head -1)" out/A3_UEFI-otg.fd 2>/dev/null || true

      - name: Clean between modes
        if: always()
        run: |
          ./build.sh -c "$PLATFORM" || true
          rm -rf Build

      - name: Build ACM image
        id: build_acm
        run: |
          set -o pipefail
          export USB_MODE=ACM
          ./build.sh -t "$TARGET" "$PLATFORM" 2>&1 | tee build-acm.log
        continue-on-error: true

      - name: Stash ACM artifacts
        if: always()
        run: |
          mkdir -p out
          cp -v Build/boot-uefi-acm.img out/ 2>/dev/null || true
          cp -v "$(find Build -name '*_UEFI.fd' | head -1)" out/A3_UEFI-acm.fd 2>/dev/null || true

      - name: Build ESP image (GRUB arm64 + device tree)
        run: |
          sh Tools/mkesp.sh -o "$GITHUB_WORKSPACE/esp.img" -s 512
          ls -l "$GITHUB_WORKSPACE/esp.img"
      - name: Verify firmware images
        run: |
          set -euo pipefail
          python3 Tools/verify_firmware.py --usb-mode OTG out/boot-uefi-otg.img out/A3_UEFI-otg.fd
          python3 Tools/verify_firmware.py --usb-mode ACM out/boot-uefi-acm.img out/A3_UEFI-acm.fd

      - name: Upload build logs
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: build-log-${{ github.run_number }}
          path: |
            build-otg.log
            build-acm.log
          if-no-files-found: warn
          retention-days: 30

      - name: Upload MT6771 UEFI firmware bundle
        if: success()
        uses: actions/upload-artifact@v4
        with:
          name: mt6771-uefi-${{ github.run_number }}
          path: |
            out/*.fd
            Build/**/*.map
          if-no-files-found: warn
          retention-days: 14

      - name: Upload ESP image
        uses: actions/upload-artifact@v4
        with:
          name: esp-${{ github.run_number }}
          path: esp.img
      - name: Upload flashable boot images
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: boot-uefi-${{ github.run_number }}
          path: out/boot-uefi-*.img
          if-no-files-found: error
          retention-days: 14

      - name: Fail if either build failed
        if: steps.build_otg.outcome == 'failure' || steps.build_acm.outcome == 'failure'
        run: |
          echo "A build failed; see build-otg.log / build-acm.log artifacts."
          exit 1
