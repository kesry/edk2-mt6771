#
# GRUB config for booting fnOS (ARM64) on OPPO A3 / MT6771.
#
# Place this file as /boot/grub/grub.cfg on the FAT32 ESP, together with
#   /EFI/BOOT/BOOTAA64.EFI   (GRUB arm64 build)
#   /a3.dtb                  (our device tree, NOT the ISO's Kunpeng one)
#   /vmlinuz                 (fnOS ARM64 kernel)
#   /initrd.img              (fnOS ARM64 initrd)
#
# The DTB must be OUR board's: the official ARM ISO ships a Kunpeng device
# tree, which describes completely different hardware.

set timeout=5
set default=0

# Text terminal: works with the simple-framebuffer GOP we expose.
terminal_output console

menuentry "fnOS (OPPO A3 / MT6771)" {
    # Load our board device tree first: GRUB hands it to the kernel and the
    # kernel will not fall back to the ISO's incompatible DTB.
    devicetree /a3.dtb

    # Update the PARTUUID to the fnOS root filesystem on this phone,
    # e.g. p44 "fnos-root": 3edee4d4-eba3-4bfc-9e93-29bad7809196
    linux /vmlinuz root=PARTUUID=3edee4d4-eba3-4bfc-9e93-29bad7809196 rw \
          console=tty0 loglevel=7

    initrd /initrd.img
}
